<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Document</title>
<!--    <link rel="stylesheet" href="./styles.css">-->
    <link rel="stylesheet" href="./user.css">
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>

    </style>
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
</head>
<body>

<mdui-layout style="height: 100vh;">
<!--    <div id="topBar" style="position: relative; overflow: hidden;">-->
    <mdui-layout-item class="top-bar">
        <mdui-top-app-bar class="mdui-top-app-bar" scroll-behavior="hide" scroll-target="mdui-layout-main">
            <mdui-top-app-bar-title>Projekty</mdui-top-app-bar-title>
        </mdui-top-app-bar>
    </mdui-layout-item>

<!--    </div>-->
    <mdui-navigation-rail value="list" style="position: relative" class="desktop-nav-rail">
        <mdui-navigation-rail-item href="/user.html" icon="list" value="list">Projekty</mdui-navigation-rail-item>
<!--        <mdui-navigation-rail-item icon="business_center" value="project">Projekt</mdui-navigation-rail-item>-->
        <mdui-navigation-rail-item icon="account_box" value="account">Konto</mdui-navigation-rail-item>
    </mdui-navigation-rail>
    <mdui-layout-main>
        <mdui-tabs class="project-nav" value="active" full-width>
            <mdui-tab value="active">Projekty</mdui-tab>
            <mdui-tab value="archived">Zarchiwizowane</mdui-tab>

            <mdui-tab-panel value="active" slot="panel">
                <mdui-layout-item class="projects projects-active">

                </mdui-layout-item>
            </mdui-tab-panel>
            <mdui-tab-panel value="archived" slot="panel">
                <mdui-layout-item class="projects projects-archived" id="fds">

                </mdui-layout-item>
            </mdui-tab-panel>
        </mdui-tabs>


        <mdui-fab id="phoneADD" onclick="newProject()" icon="add"></mdui-fab>
    </mdui-layout-main>
    <mdui-layout-item placement="bottom" class="mobile-nav-bar">
        <mdui-navigation-bar value="item-1"  label-visibility="selected">
            <div style="margin-left: 10px;"></div>
            <mdui-navigation-bar-item href="/user.html" icon="list" value="item-1">Lista Projektów</mdui-navigation-bar-item>
            <mdui-navigation-bar-item icon="account_box" value="item-3">Konto</mdui-navigation-bar-item>
<!--            <mdui-navigation-bar-item icon="more_vert"></mdui-navigation-bar-item>-->
<!--            <mdui-dropdown>-->
<!--                <mdui-button-icon style="align-self: center;" icon="more_vert" slot="trigger"></mdui-button-icon>-->
<!--                <mdui-menu>-->
    <!--                    <mdui-menu-item onclick="editMode()">Edytuj</mdui-menu-item>-->
<!--                </mdui-menu>-->
<!--            </mdui-dropdown>-->
        </mdui-navigation-bar>
    </mdui-layout-item>
</mdui-layout>


<script src="user.js"></script>
</body>
</html>
