<span id="chooser" style="cursor: pointer; color: inherit;">
  Choose an option
</span>

<ul id="option-list" style="
  display: none;
  position: absolute;
  list-style: none;
  margin: 4px 0;
  padding: 0;
  background: white;
  border: 1px solid #ccc;
  border-radius: 2px;
  min-width: 120px;
  font: inherit;
">
</ul>

<script>
    const span = document.getElementById('chooser');
    const list = document.getElementById('option-list');
    const options = ['Option A', 'Option B', 'Option C'];

    list.innerHTML = '';

    options.forEach(opt => {
        const li = document.createElement('li');
        li.textContent = opt;
        li.style.padding = '4px 8px';
        li.style.cursor = 'default';
        li.addEventListener('mouseenter', () => li.style.background = '#f0f0f0');
        li.addEventListener('mouseleave', () => li.style.background = 'white');
        li.addEventListener('click', () => {
            alert('You chose: ' + opt);
            list.style.display = 'none';
        });
        list.appendChild(li);
    });

    span.addEventListener('click', () => {
        const rect = span.getBoundingClientRect();
        list.style.left = `${rect.left}px`;
        list.style.top = `${rect.bottom + window.scrollY}px`;
        list.style.display = 'block';
    });

    document.addEventListener('click', (e) => {
        if (e.target !== span && !list.contains(e.target)) {
            list.style.display = 'none';
        }
    });
</script>
