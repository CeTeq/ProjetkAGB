<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
<!--    <meta name="viewport"-->
<!--          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">-->
<!--    <meta http-equiv="X-UA-Compatible" content="ie=edge">-->
        <link rel="stylesheet" href="style.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

    <link rel="stylesheet" href="/project/project.css" type="text/css">
    <title>Projekt</title>
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
</head>
<body>
<mdui-layout style="height: 100vh;">
    <!--    <div id="topBar" style="position: relative; overflow: hidden;">-->
    <mdui-layout-item class="top-bar">
        <mdui-top-app-bar class="mdui-top-app-bar" scroll-behavior="hide" scroll-target="mdui-layout-main" aria-rowindex="">
            <mdui-top-app-bar-title>Projekt</mdui-top-app-bar-title>
        </mdui-top-app-bar>
    </mdui-layout-item>
    <mdui-layout-main>
        <mdui-tabs class="project-nav" value="active" full-width>
            <mdui-tab value="active">Produkty</mdui-tab>
            <mdui-tab value="pricingList" class="pricingListTab">Kosztorys</mdui-tab>
            <mdui-tab value="data">Dane</mdui-tab>

            <mdui-tab-panel value="active" slot="panel">
                <div class="projectCards"></div>
                <mdui-fab id="phoneADD" onclick="addItemDialog()" icon="add"></mdui-fab>
            </mdui-tab-panel>
            <mdui-tab-panel value="pricingList" slot="panel">
                <mdui-layout-item class="pricingListDisplay print">

                </mdui-layout-item>
            </mdui-tab-panel>
        </mdui-tabs>
    </mdui-layout-main>
</mdui-layout>
<script src="/project/index.js"></script>
</body>
</html>
